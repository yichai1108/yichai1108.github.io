<nav class="navbar navbar-expand-lg navbar-light fixed-top site-navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">
            <span class="brand-mark" aria-hidden="true">NH</span>
            <span>{{ site.data.profile.navbar_name }}</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}" {% if item.new_tab %}target="_blank" rel="noopener"{% endif %}>{{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
